<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D93A32" />
    <title>Attendance Tracker</title>
    <!-- Fonts are bundled inside the app (public/fonts) so it looks the same
         offline; system-font fallback is declared in CSS. -->
    <link rel="preload" href="/fonts/BricolageGrotesque-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/fonts/BricolageGrotesque-Bold.woff2') format('woff2');
        font-weight: 700 800; font-display: swap;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('/fonts/DMSans-Regular.woff2') format('woff2');
        font-weight: 400; font-display: swap;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('/fonts/DMSans-Medium.woff2') format('woff2');
        font-weight: 500 700; font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
